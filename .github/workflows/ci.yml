name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Build before checking types: a package's types come from the built
      # dist of the package below it, and the command line bundles the browser
      # runtime out of core before its tests export a real game through it.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # The generated JSON Schema and events reference are committed. If they no
      # longer match the Zod definitions, the build is wrong, not the checkout.
      - run: pnpm generate
      - run: git diff --exit-code
